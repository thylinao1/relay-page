<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="Fusion tier ladder: extraction accuracy and contradiction recall across three tiers" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="340" fill="#FFFFFF"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1a1f24">Fusion tier ladder, 200 advisories</text>
  <text x="24" y="47" font-size="11.5" fill="#5d6772">Read the same advisory corpus three ways. Higher is better on both measures.</text>
  <line x1="150" y1="244.0" x2="700" y2="244.0" stroke="#e4e9ed" stroke-width="1"/>
  <text x="140" y="248.0" font-size="10.5" fill="#5d6772" text-anchor="end">0.00</text>
  <line x1="150" y1="209.0" x2="700" y2="209.0" stroke="#e4e9ed" stroke-width="1"/>
  <text x="140" y="213.0" font-size="10.5" fill="#5d6772" text-anchor="end">0.25</text>
  <line x1="150" y1="174.0" x2="700" y2="174.0" stroke="#e4e9ed" stroke-width="1"/>
  <text x="140" y="178.0" font-size="10.5" fill="#5d6772" text-anchor="end">0.50</text>
  <line x1="150" y1="139.0" x2="700" y2="139.0" stroke="#e4e9ed" stroke-width="1"/>
  <text x="140" y="143.0" font-size="10.5" fill="#5d6772" text-anchor="end">0.75</text>
  <line x1="150" y1="104.0" x2="700" y2="104.0" stroke="#e4e9ed" stroke-width="1"/>
  <text x="140" y="108.0" font-size="10.5" fill="#5d6772" text-anchor="end">1.00</text>
  <line x1="150" y1="244" x2="700" y2="244" stroke="#5d6772" stroke-width="1"/>
  <text x="34" y="174" font-size="11" fill="#5d6772" text-anchor="middle" transform="rotate(-90 34 174)">score, 0 to 1</text>
  <rect x="181.7" y="167.3" width="54" height="76.7" fill="#0f6d7a" rx="2"/>
  <text x="208.7" y="159.3" font-size="11.5" font-weight="700" fill="#1a1f24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.548</text>
  <rect x="247.7" y="178.1" width="54" height="65.9" fill="#8ec3cb" rx="2"/>
  <text x="274.7" y="170.1" font-size="11.5" font-weight="700" fill="#1a1f24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.471</text>
  <text x="241.7" y="264" font-size="12" fill="#1a1f24" text-anchor="middle">regex only</text>
  <rect x="365.0" y="163.5" width="54" height="80.5" fill="#0f6d7a" rx="2"/>
  <text x="392.0" y="155.5" font-size="11.5" font-weight="700" fill="#1a1f24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.575</text>
  <rect x="431.0" y="104.0" width="54" height="140.0" fill="#8ec3cb" rx="2"/>
  <text x="458.0" y="96.0" font-size="11.5" font-weight="700" fill="#1a1f24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.000</text>
  <text x="425.0" y="264" font-size="12" fill="#1a1f24" text-anchor="middle">local 3B model</text>
  <rect x="548.3" y="142.4" width="54" height="101.6" fill="#0f6d7a" rx="2"/>
  <text x="575.3" y="134.4" font-size="11.5" font-weight="700" fill="#1a1f24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.726</text>
  <rect x="614.3" y="104.0" width="54" height="140.0" fill="#8ec3cb" rx="2"/>
  <text x="641.3" y="96.0" font-size="11.5" font-weight="700" fill="#1a1f24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.000</text>
  <text x="608.3" y="264" font-size="12" fill="#1a1f24" text-anchor="middle">hybrid router</text>
  <rect x="24" y="272" width="13" height="13" fill="#0f6d7a" rx="2"/>
  <text x="44" y="283" font-size="11.5" fill="#1a1f24">extraction accuracy</text>
  <rect x="196" y="272" width="13" height="13" fill="#8ec3cb" rx="2"/>
  <text x="216" y="283" font-size="11.5" fill="#1a1f24">contradiction flag recall</text>
  <text x="24" y="306" font-size="11.5" fill="#1a1f24">The router keeps the model tier's recall and raises extraction accuracy above either tier on its own.</text>
  <text x="24" y="326" font-size="10" fill="#5d6772" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">source: evalx/results/fusion-ladder.json</text>
</svg>
